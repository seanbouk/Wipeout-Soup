format_version = 5
id = "wxl.presentation.widescreen"
version = "1.0.0"
name = "Widescreen"
author = "Wipeout2K97XL project"
description = "Reveal a wider scene with original steering and simulation speed. Experimental while track and HUD coverage is being verified."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94351"

[[feature]]
id = "widescreen"
name = "Widescreen"
description = "Expand horizontal scene visibility to 16:9 or ultrawide. OpenGL required. Ultrawide is experimental: scenery at the screen edges may pop in."
group = "Visual"
default_enabled = false

[[plugin]]
feature = "widescreen"
id = "wxl.widescreen"

[[option]]
feature = "widescreen"
id = "aspect"
label = "Aspect ratio"
type = "choice"
default = "16:9"

[[option.choice]]
value = "16:9"
label = "16:9"

[[option.choice]]
value = "64:27"
label = "21:9 ultrawide (2560x1080)"

[[option.choice]]
value = "43:18"
label = "21:9 ultrawide (3440x1440)"

[[option.choice]]
value = "window"
label = "Match window (up to 3440x1440 shape)"
